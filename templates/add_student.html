{% extends 'layout.html' %}
{% block body %}
<body>
  <div class="container text-center">
      <div class="row">
        <div class="col">
          <div class="card">
              <div class="card-body" style="width: 500px; align-self:center">
                  <form action="/add_student" method="POST">
                      <div class="mb-3">
                          <label for="studentname" class="form-label">Student Name</label>
                          <input type="text" class="form-control" id="sname" name="sname" placeholder="Name">
                        </div>
                        <div class="mb-3">
                          <label for="studentid" class="form-label">Student Roll no</label>
                          <input type="text" class="form-control" id="sid" name="sid" placeholder="Roll no">
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                  </form>
                  <br>
                  <a href="/trainmodel" class="btn" style="color:rgb(255, 255, 255); width:5cm; height:1cm; background-color:black">Train model</a>
              </div>
            </div>
        </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
 
</body>
</html>
{% endblock body %}
