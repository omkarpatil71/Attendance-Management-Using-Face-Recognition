<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      nav {
        background-color:rgba(0, 0, 0, 0.422);
        
      }

    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg ">
      <div class="container-fluid">
        <img src="static/fclogo1.png" alt="Bootstrap" width="30" height="30"><br>
        <a class="navbar-brand" style="color: azure;" href="admindashboard">Home</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item" style="padding-left:1350px">
              <a href="{{ url_for('adminlogout') }}" class="btn btn-danger">Logout</a>

            </li>
          </ul>
        </div>
      </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <div class="container text-center mt-5">
        <h1>Face Recognition Attendance</h1>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} mt-3">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Simple Form -->
        <form action="/mark_attendance" method="post">
                <label for="subject">Select Subject:</label>
                <select name="subject" required>
                    <option value="">-- Choose Subject --</option>
                    <option value="OT">OT</option>
                    <option value="Java">Java</option>
                    <option value="Elective-21">Elective-21</option>
                    <option value="Elective-22">Elective-22</option>
                    <option value="RM">RM</option>
                    <option value="Lab">Lab</option>
                    <option value="Mini-Project">Mini-Project</option>
                </select>
            <button type="submit" class="btn btn-primary mt-3">Punch Attendance</button>
        </form>
    </div>
</div>
</div>
</body>
</html>
