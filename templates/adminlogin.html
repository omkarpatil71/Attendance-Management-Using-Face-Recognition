<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      nav {
        background-color: rgba(0, 0, 0, 0.422);
        
      }

    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg ">
      <div class="container-fluid">
        <img src="static/fclogo1.png" alt="Bootstrap" width="30" height="30"><br>
        <a class="navbar-brand" style="color: rgb(0, 0, 0);" href="/">Home</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
          </ul>
        </div>
      </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block body %}
    <div class="container text-center" style="padding-top:3cm; width:550px">
        <div class="row">
          <div class="col">
            <div class="card">
                <div class="card-body" style="width: 500px; align-self:center">
                  <span class="placeholder col-12" style="height:1cm; background-color:black; color:aliceblue; align-content:center;">Admin Login</span>
                  <br>
                  {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                      {% for category, message in messages %}
                        <div class="alert alert-{{ category }} mt-3">{{ message }}</div>
                      {% endfor %}
                    {% endif %}
                  {% endwith %}
                    <form action="/adminlogin" method="POST">
                          <div class="mb-3">
                            <br>
                            <label for="Admin_id" class="form-label">Admin username</label>
                            <input type="text" class="form-control" id="Admin_id" name="Admin_id" placeholder="Admin Id">
                          </div>
                          <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="text" class="form-control" id="password" name="password" placeholder="Password here">
                          </div>
                          <button type="submit" class="btn" style="color:rgb(255, 255, 255); width:5cm; height:1cm; background-color:black">Submit</button>
                          <!-- <p>Forgot password? Click below</p> -->
                          <!-- <a href="/resetpassword" class="btn" style="color:rgb(255, 255, 255); width:5cm; height:1cm; background-color:black">Reset Password</a> -->
                    </form> 
                </div>
              </div>
          </div>
    {% endblock body %}
  </body>
</html>
